[project]
name = "bia-agent-studio"
version = "0.1.0"
description = "BIA Agent Studio — Foundation, Agent Management and Runtime"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143.2,<0.144",
    "uvicorn>=0.41,<1",
    "sqlalchemy>=2.0.48,<2.1",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.13,<3",
    "jsonschema>=4.25,<5",
    "langgraph==1.2.15",
    "litellm==1.105.1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
markers = ["integration: requires a real PostgreSQL database"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["apps/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
