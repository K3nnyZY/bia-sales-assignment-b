name: bia-agent-studio

x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: base
  env_file: .env
  environment: &api-env
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    # Compose uses POSTGRES_*; optional DATABASE_URL is for native development.
    DATABASE_URL: ""

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 5s
      timeout: 10s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  web-check:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    command: ["sh", "-c", "npm run lint && npm run typecheck && npm test"]

  tests:
    <<: *api
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    environment:
      <<: *api-env
      RUN_DB_TESTS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["pytest", "-p", "no:cacheprovider"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
